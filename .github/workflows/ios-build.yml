name: iOS project validation and unsigned package

on:
  push:
    paths:
      - "iOS/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "iOS/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project iOS/ChertAI.xcodeproj \\
            -scheme ChertAI \\
            -configuration Debug \\
            -destination 'generic/platform=iOS Simulator' \\
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive unsigned iPhone app
        run: |
          xcodebuild -project iOS/ChertAI.xcodeproj \\
            -scheme ChertAI \\
            -configuration Release \\
            -destination 'generic/platform=iOS' \\
            -archivePath "$RUNNER_TEMP/ChertAI.xcarchive" \\
            CODE_SIGNING_ALLOWED=NO archive
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ChertAI.xcarchive/Products/Applications/ChertAI.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qr "$RUNNER_TEMP/ChertAI-unsigned.ipa" Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChertAI-unsigned-IPA
          path: \${{ runner.temp }}/ChertAI-unsigned.ipa
          if-no-files-found: error
