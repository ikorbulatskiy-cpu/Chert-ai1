name: iOS build and signed IPA

on:
  push:
    paths:
      - "iOS/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "iOS/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  unsigned:
    name: Validate and build unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose Apple build runner
        run: |
          echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project iOS/ChertAI.xcodeproj \
            -scheme ChertAI \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive unsigned iPhone app
        run: |
          xcodebuild -project iOS/ChertAI.xcodeproj \
            -scheme ChertAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ChertAI.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ChertAI.xcarchive/Products/Applications/ChertAI.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qr "$RUNNER_TEMP/ChertAI-unsigned.ipa" Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChertAI-unsigned-IPA
          path: ${{ runner.temp }}/ChertAI-unsigned.ipa
          if-no-files-found: error

  signed:
    name: Sign IPA for registered iPhone
    if: ${{ github.event_name == 'workflow_dispatch' && secrets.IOS_CERTIFICATE_P12_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install signing certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/chert-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Detect signing type and identity
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/profile.plist" 2>/dev/null || echo false)
          if [ "$GET_TASK_ALLOW" = "true" ]; then
            echo "SIGNING_IDENTITY=Apple Development" >> "$GITHUB_ENV"
            echo "EXPORT_METHOD=development" >> "$GITHUB_ENV"
          else
            echo "SIGNING_IDENTITY=Apple Distribution" >> "$GITHUB_ENV"
            echo "EXPORT_METHOD=ad-hoc" >> "$GITHUB_ENV"
          fi

      - name: Archive signed iPhone app
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project iOS/ChertAI.xcodeproj \
            -scheme ChertAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ChertAI-signed.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

      - name: Export signed IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>ru.chertai.ios</key><string>$PROFILE_UUID</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ChertAI-signed.xcarchive" \
            -exportPath "$RUNNER_TEMP/signed-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp "$RUNNER_TEMP/signed-export/ChertAI.ipa" "$RUNNER_TEMP/ChertAI-signed.ipa"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChertAI-signed-IPA
          path: ${{ runner.temp }}/ChertAI-signed.ipa
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/chert-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
